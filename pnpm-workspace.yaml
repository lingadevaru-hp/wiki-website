# Require package releases to age for at least one day before installing them.
# Keep this supply-chain safeguard enabled unless an urgent patch requires a
# documented, temporary exception.
packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

allowBuilds:
  esbuild: true

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.21
  '@replit/vite-plugin-dev-banner': ^0.1.2
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-query': ^5.104.5
  '@types/node': ^25.9.9
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^5.2.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.4
  framer-motion: ^12.43.0
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  tsx: ^4.21.0
  vite: ^7.3.7
  wouter: ^3.3.5
  zod: ^4.6.7

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  # Keep the build tool on a patched version, including drizzle-kit transitives.
  esbuild: 0.28.2
  # Miniflare pins an affected undici release; keep its API-compatible 7.x fix.
  'miniflare>undici': 7.30.1
  postcss-selector-parser: 6.1.5
