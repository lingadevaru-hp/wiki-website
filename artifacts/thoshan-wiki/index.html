  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
<div id="tts-player" style="margin: 1rem 0;"><button id="tts-btn">🔊 Listen to this article</button><audio id="tts-audio" controls style="display:none; width:100%; margin-top:0.5rem;"></audio></div>
<script>
  const TTS_WORKER_URL = "https://article-tts.lingadevaru203.workers.dev";
  const btn = document.getElementById("tts-btn");
  const audio = document.getElementById("tts-audio");

  btn.addEventListener("click", async () => {
    const articleEl = document.querySelector("article") || document.body;
    const text = articleEl.innerText.trim();
    if (!text) return;

    btn.disabled = true;
    btn.textContent = "⏳ Generating audio…";

    const url = TTS_WORKER_URL + "?text=" + encodeURIComponent(text);
    audio.src = url;
    audio.style.display = "block";
    audio.play().catch(() => {});

    btn.textContent = "🔊 Listen to this article";
    btn.disabled = false;
  });
</script>
  </body>
